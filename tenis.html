<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sports Edge · Tenis</title>
<style>
:root{--bg:#0b0f17;--card:#121826;--card2:#0f1522;--line:#1f2937;--txt:#e5e7eb;--mut:#8b95a7;--acc:#22c55e;--blue:#38bdf8;--red:#ef4444;--amb:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px}
.logo{font-weight:700;font-size:20px;letter-spacing:.5px;color:var(--txt);text-decoration:none}
.logo span{color:var(--acc)}
.right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.right a{color:var(--blue);text-decoration:none;font-weight:600;font-size:14px}
.lang button{background:var(--card);color:var(--mut);border:1px solid var(--line);padding:6px 12px;cursor:pointer;font-weight:600}
.lang button.on{color:var(--bg);background:var(--acc);border-color:var(--acc)}
main{max-width:1000px;margin:0 auto;padding:22px 20px}
h1{font-size:26px;margin:6px 0}
.lead{color:var(--mut);font-size:14px;margin-bottom:6px}
.tabs{display:flex;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:6px}
.tb{background:transparent;color:var(--mut);border:1px solid var(--line);padding:7px 16px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600}
.tb.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
h2{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--blue);margin:26px 0 6px}
.note{color:var(--mut);font-size:13px;margin-bottom:12px}
.warn{background:var(--card);border:1px solid var(--amb);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--amb);margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card .n{font-size:24px;font-weight:700}
.card .n.g{color:var(--acc)}
.card .l{color:var(--mut);font-size:12px}
.card .s{color:var(--mut);font-size:11px;margin-top:2px}
.hero{background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:16px 18px;margin:16px 0}
.hero .big{font-size:34px;font-weight:800;color:var(--acc)}
.hero .sm{color:var(--mut);font-size:12px;margin-top:4px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
th,td{padding:8px 12px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;background:var(--card2)}
td:first-child,th:first-child{text-align:left}
tr:last-child td{border-bottom:0}
.bars{display:flex;flex-direction:column;gap:3px;min-width:120px}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%}
.bp{background:var(--blue)}
.br{background:var(--acc)}
.leg{font-size:11px;color:var(--mut);margin-top:6px}
.day{font-size:12px;color:var(--blue);font-weight:600;margin:16px 0 6px}
.day::first-letter{text-transform:uppercase}
.m{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.mt{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:6px;gap:8px;flex-wrap:wrap}
.pr{display:grid;grid-template-columns:1fr 70px 70px 1fr;gap:8px;align-items:center;font-size:14px;padding:3px 0}
.pr .v{text-align:center;background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:3px 2px}
.pr .v b{display:block;font-size:14px}
.pr .v small{font-size:11px;color:var(--mut)}
.pr .v.best{border-color:var(--acc)}
.pr .v.best b{color:var(--acc)}
.pl{text-align:left}
.pl2{text-align:right}
.vb{display:inline-block;background:var(--acc);color:var(--bg);font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px}
.cq{font-size:12px;color:var(--mut);margin-top:6px}
.cq b{color:var(--txt)}
.ex{display:grid;grid-template-columns:60px 1fr 150px 28px;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:13px}
.ex .d{color:var(--mut);font-size:12px}
.ok{color:var(--acc);font-weight:700}
.ko{color:var(--red);font-weight:700}
.empty{color:var(--mut);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:10px;font-size:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--mut);margin-top:14px}
.sd{font-size:12px;color:var(--mut);margin-top:10px}
@media(max-width:720px){.ex{grid-template-columns:1fr 24px}.ex .d{display:none}.pr{grid-template-columns:1fr 60px 60px 1fr;font-size:13px}th,td{padding:6px 6px;font-size:12px}}
footer{color:var(--mut);font-size:12px;padding:24px;text-align:center;border-top:1px solid var(--line);margin-top:30px}
footer a{color:var(--blue)}
</style>
</head>
<body>
<header id="top"></header>
<main>
  <h1 id="h1"></h1>
  <div class="lead" id="lead"></div>
  <div class="tabs"><button class="tb" id="t-pred" onclick="go('pred')"></button><button class="tb" id="t-stats" onclick="go('stats')"></button></div>
  <div id="m"></div>
</main>
<footer id="foot"></footer>

<script src="nav.js"></script>
<script>
var T={

 tour:"Torneos activos",win:"Gana",fair:"cuota justa",bestodds:"Mejor cuota",edge:"Ventaja",market:"Mercado",vbadge:"VALOR",

};
var lang="es", tab="pred";
try{ lang=localStorage.getItem("lang")||(navigator.language.indexOf("es")==0?"es":"en"); }catch(e){}
try{ if((location.hash||"")==="#stats") tab="stats"; }catch(e){}
var D={t:null,b:null};

function setLang(l){ lang=l; try{localStorage.setItem("lang",l)}catch(e){} render(); }
function go(x){ tab=x; try{ location.hash=(x==="stats"?"stats":""); }catch(e){} render(); }
function t(k){ return T[lang][k]; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function num(x){ return typeof x==="number" && isFinite(x); }
function dec(v,n){ var s=v.toFixed(n); return lang==="es"?s.replace(".",","):s; }
function pc(x,d){ return num(x)?dec(x*100,d||0)+"%":t("nodata"); }
function odd(p){ return (num(p)&&p>0)?dec(1/p,2):"-"; }
function rng(ic){ return ic?pc(ic[0])+" – "+pc(ic[1]):t("nodata"); }
function loc(){ return lang==="es"?"es-ES":"en-GB"; }
function ftime(iso){ try{ return new Date(iso).toLocaleTimeString(loc(),{hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
function fday(iso){ try{ return new Date(iso).toLocaleDateString(loc(),{weekday:"long",day:"numeric",month:"long"}); }catch(e){ return ""; } }
function fint(n){ var s=String(n); return s.length===8 ? s.substr(6,2)+"/"+s.substr(4,2)+"/"+s.substr(0,4) : s; }
function fshort(n){ var s=String(n); return s.length===8 ? s.substr(6,2)+"/"+s.substr(4,2) : s; }
function supName(s){ return s ? t("sup_"+s) : t("sup_none"); }
function card(l,v,s,g){ return '<div class="card"><div class="n'+(g?' g':'')+'">'+esc(v)+'</div><div class="l">'+esc(l)+'</div>'+(s?'<div class="s">'+esc(s)+'</div>':'')+'</div>'; }

function oldWarn(o){
  if(o && num(o.dias_desde_datos) && o.dias_desde_datos>30){
    return '<div class="warn">'+t("old1")+' '+fint(o.datos_hasta)+'. '+t("old2")+'</div>';
  }
  return "";
}

function pPred(){
  var d=D.t;
  if(!d) return '<div class="empty">'+t("empty")+'</div>';
  var o=oldWarn(d);
  if(d.torneos && d.torneos.length){ o+='<div class="note">'+t("tour")+': '+esc(d.torneos.join(" · "))+'</div>'; }
  var list=d.predicciones||[];
  if(!list.length){ o+='<div class="empty">'+t("nomatch")+'</div>'; }
  else{
    var last="";
    for(var i=0;i<list.length;i++){
      var p=list[i], c=p.cuota, day=fday(p.fecha), b1=p.p1>=p.p2;
      if(day!==last){ o+='<div class="day">'+esc(day)+'</div>'; last=day; }
      var v1=c&&c.valor&&c.valor.indexOf("1")>=0, v2=c&&c.valor&&c.valor.indexOf("2")>=0;
      o+='<div class="m"><div class="mt"><span>'+esc(ftime(p.fecha))+' · '+esc(p.torneo)+' · '+esc(p.tour)+'</span><span>'+esc(supName(p.sup))+'</span></div>'
        +'<div class="pr"><span class="pl">'+esc(p.j1)+(v1?'<span class="vb">'+t("vbadge")+'</span>':'')+'</span>'
        +'<div class="v'+(b1?' best':'')+'"><b>'+pc(p.p1)+'</b><small>'+odd(p.p1)+'</small></div>'
        +'<div class="v'+(!b1?' best':'')+'"><b>'+pc(p.p2)+'</b><small>'+odd(p.p2)+'</small></div>'
        +'<span class="pl2">'+esc(p.j2)+(v2?'<span class="vb">'+t("vbadge")+'</span>':'')+'</span></div>';
      if(c && c.mejor && c.mercado && c.ev){
        o+='<div class="cq">'+t("bestodds")+': <b>'+esc(p.j1)+' '+dec(c.mejor["1"].c,2)+'</b> ('+esc(c.mejor["1"].casa)+') · <b>'+esc(p.j2)+' '+dec(c.mejor["2"].c,2)+'</b> ('+esc(c.mejor["2"].casa)+')<br>'
          +t("market")+': '+pc(c.mercado["1"])+' / '+pc(c.mercado["2"])+' · '+t("edge")+': <b>'+(c.ev["1"]>=0?"+":"")+dec(c.ev["1"]*100,1)+'%</b> / <b>'+(c.ev["2"]>=0?"+":"")+dec(c.ev["2"]*100,1)+'%</b></div>';
      } else { o+='<div class="cq">'+t("nocuota")+'</div>'; }
      o+='</div>';
    }
    o+='<div class="sd">'+t("vnote")+'</div>';
  }
  if(d.sin_datos && d.sin_datos.length){ o+='<div class="sd">'+t("sd")+': '+esc(d.sin_datos.join(" · "))+'</div>'; }
  return o;
}

function groupTable(obj,nameFn){
  var o='<table><tr><th>'+t("th_c")+'</th><th>'+t("th_n")+'</th><th>'+t("th_hit")+'</th><th>'+t("ic")+'</th><th>'+t("th_br")+'</th></tr>', any=false;
  for(var k in obj){ var L=obj[k]; if(!L) continue; any=true;
    o+='<tr><td>'+esc(nameFn(k))+'</td><td>'+L.n+'</td><td><b>'+pc(L.acierto,1)+'</b></td><td>'+rng(L.ic)+'</td><td>'+dec(L.brier,3)+'</td></tr>'; }
  return any ? o+'</table>' : '<div class="empty">'+t("empty")+'</div>';
}

function pStats(){
  var b=D.b;
  if(!b||!b.total) return '<div class="empty">'+t("empty")+'</div>';
  var tot=b.total, o=oldWarn(b);
  o+='<h2>'+t("h_bt")+'</h2><div class="note">'+t("n_bt")+' · '+t("from")+': '+fint(b.desde)+' · '+t("upto")+': '+fint(b.datos_hasta)+'</div>';
  var hero=null, tr=b.tramos||[];
  for(var i=0;i<tr.length;i++){ if(Math.abs(tr[i].min-0.7)<0.001 && tr[i].n>0 && num(tr[i].acierto)) hero=tr[i]; }
  if(hero){ o+='<div class="hero"><div>'+t("hero1")+' '+pc(hero.min)+' '+t("hero2")+'</div><div class="big">'+pc(hero.acierto,1)+'</div><div class="sm">'+hero.n+' '+t("hero3")+': '+rng(hero.ic)+'</div></div>'; }
  o+='<div class="grid">'+card(t("matches"),String(tot.n))+card(t("hit"),pc(tot.acierto,1),tot.aciertos+" / "+tot.n,true)
    +card(t("ic"),rng(tot.ic))+card(t("brier"),dec(tot.brier,3),t("bz"))
    +card(t("rk"),pc(tot.mejor_ranking,1),t("rks")+" ("+tot.n_ranking+")")
    +card(t("ours"),pc(tot.acierto_mismo_grupo,1))+'</div>';
  o+='<h2>'+t("h_tr")+'</h2><table><tr><th>'+t("th_min")+'</th><th>'+t("th_n")+'</th><th>'+t("th_conf")+'</th><th>'+t("th_real")+'</th><th>'+t("ic")+'</th></tr>';
  for(var j=0;j<tr.length;j++){ var r=tr[j]; o+='<tr><td>≥ '+pc(r.min)+'</td><td>'+r.n+'</td><td>'+pc(r.conf,1)+'</td><td><b>'+pc(r.acierto,1)+'</b></td><td>'+rng(r.ic)+'</td></tr>'; }
  o+='</table><h2>'+t("h_cal")+'</h2><div class="note">'+t("n_cal")+'</div><table><tr><th>'+t("th_rng")+'</th><th>'+t("th_n")+'</th><th>'+t("th_prom")+'</th><th>'+t("th_real")+'</th><th>'+t("th_bars")+'</th></tr>';
  var cb=b.calibracion||[];
  for(var c=0;c<cb.length;c++){ var k=cb[c]; if(!k.n) continue;
    o+='<tr><td>'+k.desde+'–'+k.hasta+'%</td><td>'+k.n+'</td><td>'+pc(k.prometido,1)+'</td><td><b>'+pc(k.real,1)+'</b></td><td><div class="bars"><div class="bar"><i class="bp" style="width:'+(k.prometido*100)+'%"></i></div><div class="bar"><i class="br" style="width:'+(k.real*100)+'%"></i></div></div></td></tr>'; }
  o+='</table><div class="leg">'+t("leg")+'</div>';
  o+='<h2>'+t("h_sup")+'</h2>'+groupTable(b.superficies||{},function(k){return t("sup_"+k);});
  o+='<h2>'+t("h_cir")+'</h2>'+groupTable(b.circuitos||{},function(k){return k;});
  o+='<h2>'+t("h_ex")+'</h2><div class="note">'+t("n_ex")+'</div>';
  var ex=b.ejemplos||[];
  for(var e=0;e<ex.length;e++){ var x=ex[e];
    o+='<div class="ex"><span class="d">'+fshort(x.fecha)+'</span><span>'+esc(x.ganador)+' – '+esc(x.perdedor)+' <b>'+esc(x.marcador)+'</b><br><span class="d">'+esc(x.tour)+' · '+esc(x.torneo)+'</span></span><span class="d">'+t("pick")+': '+esc(x.fav)+' ('+pc(x.pp)+')</span><span class="'+(x.ok?"ok":"ko")+'">'+(x.ok?"✓":"✗")+'</span></div>'; }
  var dr=(D.t&&D.t.directo)||{};
  o+='<h2>'+t("h_live")+'</h2><div class="note">'+t("n_live")+'</div><div class="grid">'
    +card(t("l_tot"),num(dr.total)?String(dr.total):t("nodata"))+card(t("l_res"),num(dr.resueltas)?String(dr.resueltas):t("nodata"))
    +card(t("l_hit"),pc(dr.acierto,1))+card(t("l_brier"),num(dr.brier)?dec(dr.brier,3):t("nodata"))
    +card(t("l_roi"),num(dr.roi)?((dr.roi>=0?"+":"")+dec(dr.roi*100,1)+"%"):t("nodata"),num(dr.apuestas)?dr.apuestas+" "+t("l_bets"):"")+'</div>';
  return o+'<div class="box">'+t("method")+'</div>';
}

function render(){
  if(window.navRender) navRender(lang,"tenis");
  document.documentElement.lang=lang;
  document.getElementById("h1").textContent="🎾 "+t("title");
  document.getElementById("lead").textContent=t("lead");
  var fu=(D.t&&D.t.fuentes)||(D.b&&D.b.fuentes)||{}, vis={}, fl=[];
  for(var fk in fu){ var F=fu[fk]; if(!F||!F.url) continue;
    if(vis[F.url]){ vis[F.url].c.push(fk); continue; }
    vis[F.url]={F:F,c:[fk]}; fl.push(vis[F.url]); }
  var fh=fl.map(function(x){ return esc(x.c.join("/"))+': <a href="'+esc(x.F.url)+'" target="_blank" rel="noopener">'+esc(x.F.nombre)+'</a> ('+esc(x.F.licencia)+')'; }).join(' · ');
  document.getElementById("foot").innerHTML=esc(t("foot"))+(fh?' '+fh:'');
  document.getElementById("t-pred").textContent=t("t_pred");
  document.getElementById("t-stats").textContent=t("t_stats");
  document.getElementById("t-pred").className="tb"+(tab==="pred"?" on":"");
  document.getElementById("t-stats").className="tb"+(tab==="stats"?" on":"");
  document.getElementById("m").innerHTML = tab==="stats" ? pStats() : pPred();
}
function load(f,k){ return fetch("data/"+f+"?v="+Date.now()).then(function(r){return r.json();}).then(function(j){D[k]=j;}).catch(function(){D[k]=null;}); }
Promise.all([load("tenis.json","t"),load("tenis_backtest.json","b")]).then(render);
render();
</script>
