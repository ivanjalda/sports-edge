<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sports Edge · Motor</title>
<meta name="description" content="Probabilidades de victoria, podio y puntos en Fórmula 1 y MotoGP con un motor propio probado en carreras reales.">
<style>
:root{--bg:#0b0f17;--card:#121826;--card2:#0f1522;--line:#1f2937;--txt:#e5e7eb;--mut:#8b95a7;--acc:#22c55e;--blue:#38bdf8;--red:#ef4444;--amb:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
main{padding:22px 0}
h1{font-size:26px;margin:6px 0}
.lead{color:var(--mut);font-size:14px;margin-bottom:10px}
.ligas{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.lg{display:flex;white-space:nowrap;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 16px;cursor:pointer;font-weight:700;color:var(--mut);font-size:14px}
.lg.on{border-color:var(--acc);color:var(--txt);box-shadow:0 0 0 1px var(--acc) inset}
.lg .ic{font-size:20px}
.tabs{display:flex;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:6px;flex-wrap:wrap}
.tb{background:transparent;color:var(--mut);border:1px solid var(--line);padding:7px 16px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600}
.tb.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
h2{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--blue);margin:26px 0 8px}
.note{color:var(--mut);font-size:13px;margin:8px 0 12px}
.gp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.gp .t{font-size:22px;font-weight:800}
.gp .s{color:var(--mut);font-size:13px;margin-top:2px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:10px}
.badge.on{color:var(--acc);border:1px solid var(--acc)}
.badge.pre{color:var(--amb);border:1px solid var(--amb)}
.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tc{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tc.f{border-color:var(--acc)}
.tc .p{font-size:12px;color:var(--mut)}
.tc .n{font-size:17px;font-weight:800;margin-top:2px}
.tc .e{font-size:12px;color:var(--mut)}
.tc .w{font-size:28px;font-weight:800;color:var(--acc);margin-top:6px;line-height:1}
.tc .w small{font-size:12px;color:var(--mut);font-weight:600}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th,td{padding:8px 12px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;background:var(--card2)}
td.l,th.l{text-align:left}
tr:last-child td{border-bottom:0}
td .sub{display:block;font-size:11.5px;color:var(--mut)}
.cb{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.cb .bar{flex:1;max-width:120px;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.cb .bar i{display:block;height:100%;background:var(--acc)}
.cb b{min-width:44px;text-align:right}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card .n{font-size:24px;font-weight:800}
.card .n.g{color:var(--acc)}
.card .l{color:var(--mut);font-size:12.5px}
.card .s{color:var(--mut);font-size:11.5px;margin-top:2px}
.ex{display:grid;grid-template-columns:96px 1fr 1fr 110px;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px;margin-bottom:6px;font-size:13.5px}
.ex .d{color:var(--mut);font-size:12px}
.ok{color:var(--acc);font-weight:700}
.ko{color:var(--red);font-weight:700}
.empty{color:var(--mut);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:12px;font-size:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:13px;color:var(--mut);margin-top:14px}
@media(max-width:720px){ .top3{grid-template-columns:1fr} th,td{padding:6px;font-size:12.5px} .hide-m{display:none} .ex{grid-template-columns:1fr 1fr} .ex .d{grid-column:1 / 3} main{padding:16px 0} }
footer{color:var(--mut);font-size:12px;padding:24px;text-align:center;border-top:1px solid var(--line);margin-top:30px}
</style>
</head>
<body>
<header id="top"></header>
<main>
  <h1 id="h1"></h1>
  <div class="lead" id="lead"></div>
  <div class="ligas" id="ligas"></div>
  <div class="tabs">
    <button class="tb" id="t-pred" onclick="go('pred')"></button>
    <button class="tb" id="t-stats" onclick="go('stats')"></button>
    <button class="tb" id="t-rank" onclick="go('rank')"></button>
    <button class="tb" id="t-hist" onclick="go('hist')"></button>
  </div>
  <div id="m"></div>
</main>
<footer id="foot"></footer>
<script src="nav.js"></script>
<script>
var SERIES=[{id:"f1",ic:"🏎️",es:"Fórmula 1",en:"Formula 1"},{id:"motogp",ic:"🏍️",es:"MotoGP",en:"MotoGP"}];
var T={
es:{h1:"🏁 Motor",lead:"Probabilidad de victoria, podio y puntos de cada piloto con nuestro motor propio: fuerza del piloto y de su coche o moto, posición de salida y abandonos, calculado solo con resultados reales y probado en carreras que el motor no había visto.",
 t_pred:"Próxima carrera",t_stats:"Estadísticas",t_rank:"Fuerza de pilotos",t_hist:"Historial",
 race:"Carrera",quali:"Clasificación",pre:"Antes de la clasificación: se actualizará con la parrilla de salida",grid:"Con la parrilla de salida",
 pos:"#",driver:"Piloto",start:"Sale",win:"Victoria",podium:"Podio",points:"Puntos",fav:"Favorito",second:"2.º favorito",third:"3.º favorito",towin:"de ganar",
 dnf:"Abandonos tenidos en cuenta: %s de los pilotos no terminan (media real de las últimas carreras).",
 nonext:"No hay ninguna carrera próxima en el calendario: la temporada ha terminado. Volverá con la primera carrera del año que viene.",
 nodata:"Todavía se están descargando los resultados históricos. Aparecerá en la próxima actualización.",
 mt:"Cómo acierta el motor en carreras que no había visto",mt_n:"Prueba con %s carreras de las temporadas %s.",
 m_pre:"Antes de la clasificación",m_grid:"Con la parrilla de salida",fav_w:"el favorito gana",pod:"pilotos del podio acertados",
 rnd:"si se eligiera al azar: %s",pole:"el que sale primero gana",live:"En directo (predicciones guardadas antes de cada carrera)",
 live_n:"%s carreras",live_none:"Aún no ha terminado ninguna carrera desde que guardamos predicciones.",
 rk:"Fuerza actual",rk_n:"Índice del motor: fuerza del piloto más la de su equipo. Solo sirve para comparar entre ellos.",team:"Equipo",total:"Fuerza total",only:"Solo piloto",
 teams:"Fuerza de los equipos",h_rec:"Nuestras predicciones y lo que pasó",h_last:"Últimos ganadores",our:"Nuestro favorito",won:"Ganó",gave:"le dábamos",
 hit:"✓ acertado",miss:"✗ fallado",h_none:"Todavía no hay carreras resueltas.",src:"Datos",
 foot:"Solo para mayores de 18 años. Las probabilidades son estimaciones estadísticas y no garantizan resultados. Juega con responsabilidad."},
en:{h1:"🏁 Motorsport",lead:"Win, podium and points probability for every driver from our own engine: driver and car/bike strength, starting position and retirements, built only on real results and tested on races the engine had not seen.",
 t_pred:"Next race",t_stats:"Statistics",t_rank:"Driver strength",t_hist:"History",
 race:"Race",quali:"Qualifying",pre:"Before qualifying: it will update with the starting grid",grid:"With the starting grid",
 pos:"#",driver:"Driver",start:"Grid",win:"Win",podium:"Podium",points:"Points",fav:"Favourite",second:"2nd favourite",third:"3rd favourite",towin:"to win",
 dnf:"Retirements included: %s of drivers do not finish (real average of recent races).",
 nonext:"There is no upcoming race in the calendar: the season is over. It returns with next year's first race.",
 nodata:"Historical results are still downloading. It will appear in the next update.",
 mt:"How the engine does on races it had not seen",mt_n:"Test with %s races from the %s seasons.",
 m_pre:"Before qualifying",m_grid:"With the starting grid",fav_w:"the favourite wins",pod:"podium drivers predicted",
 rnd:"picking at random: %s",pole:"pole sitter wins",live:"Live (predictions saved before each race)",
 live_n:"%s races",live_none:"No race has finished yet since we started saving predictions.",
 rk:"Current strength",rk_n:"Engine index: driver strength plus their team's. Only meaningful to compare them.",team:"Team",total:"Total strength",only:"Driver only",
 teams:"Team strength",h_rec:"Our predictions and what happened",h_last:"Latest winners",our:"Our favourite",won:"Won",gave:"we gave",
 hit:"✓ correct",miss:"✗ wrong",h_none:"No races resolved yet.",src:"Data",
 foot:"18+ only. Probabilities are statistical estimates and do not guarantee results. Please gamble responsibly."}
};
var lang="es", serie="f1", tab="pred", D={};
try{ lang=localStorage.getItem("lang")||(navigator.language.indexOf("es")==0?"es":"en"); }catch(e){}
try{ var q=new URLSearchParams(location.search); if(q.get("serie")) serie=q.get("serie"); if(q.get("tab")) tab=q.get("tab"); }catch(e){}
function setLang(l){ lang=l; try{localStorage.setItem("lang",l)}catch(e){} render(); }
function t(k){ return T[lang][k]; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function pc(x){ if(x==null) return "–"; var v=x*100; return (v<1&&v>0?(lang==="es"?v.toFixed(1).replace(".",","):v.toFixed(1)):Math.round(v))+"%"; }
function fecha(iso,conHora){ try{ var d=new Date(iso); var o={weekday:"long",day:"numeric",month:"long"}; if(conHora){o.hour="2-digit";o.minute="2-digit";}
  return d.toLocaleString(lang==="es"?"es-ES":"en-GB",o); }catch(e){ return iso; } }
function go(x){ tab=x; render(); }
function setS(s){ serie=s; render(); }
function cb(x){ return '<div class="cb"><div class="bar"><i style="width:'+Math.min(100,Math.round((x||0)*100))+'%"></i></div><b>'+pc(x)+'</b></div>'; }

function vPred(d){
  var p=d.proximo; if(!p) return '<div class="empty">'+t("nonext")+'</div>';
  var o='<div class="gp"><div class="t">'+esc(p.nombre)+'</div><div class="s">'+esc(p.circuito)+(p.pais?' · '+esc(p.pais):'')+'</div>'
    +'<div class="s">'+t("race")+': <b>'+esc(fecha(p.fecha,true))+'</b>'+(p.clasif?' · '+t("quali")+': '+esc(fecha(p.clasif,true)):'')+'</div>'
    +'<span class="badge '+(p.tipo==="parrilla"?'on':'pre')+'">'+(p.tipo==="parrilla"?t("grid"):t("pre"))+'</span>';
  var L=p.pilotos||[], nom=[t("fav"),t("second"),t("third")];
  o+='<div class="top3">'+L.slice(0,3).map(function(x,i){ return '<div class="tc'+(i===0?' f':'')+'"><div class="p">'+nom[i]+'</div><div class="n">'+esc(x.n)+'</div><div class="e">'+esc(x.eq)+(x.grid?' · '+t("start")+' '+x.grid+'.º':'')+'</div><div class="w">'+pc(x.pw)+' <small>'+t("towin")+'</small></div></div>'; }).join("")+'</div></div>';
  o+='<table><tr><th>'+t("pos")+'</th><th class="l">'+t("driver")+'</th>'+(p.tipo==="parrilla"?'<th>'+t("start")+'</th>':'')+'<th>'+t("win")+'</th><th>'+t("podium")+'</th><th class="hide-m">'+t("points")+'</th></tr>'
    +L.map(function(x,i){ return '<tr><td>'+(i+1)+'</td><td class="l"><b>'+esc(x.n)+'</b><span class="sub">'+esc(x.eq)+'</span></td>'+(p.tipo==="parrilla"?'<td>'+(x.grid||'–')+'</td>':'')
      +'<td>'+cb(x.pw)+'</td><td>'+pc(x.pp)+'</td><td class="hide-m">'+pc(x.p10)+'</td></tr>'; }).join("")+'</table>';
  o+='<div class="note">'+t("dnf").replace("%s",pc(d.abandono))+'</div>';
  return o;
}
function vStats(d){
  var m=d.motor||{}, a=m.prueba_previa||{}, b=m.prueba_parrilla||{}, n=Math.round(Math.exp(m.azar_logloss||Math.log(20)));
  var o='<h2>'+t("mt")+'</h2><div class="note">'+t("mt_n").replace("%s",a.carreras||"–").replace("%s",(m.temporadas_prueba||[]).join(" y "))+'</div>';
  o+='<div class="grid"><div class="card"><div class="l">'+t("m_pre")+'</div><div class="n g">'+pc(a.favorito_gana)+'</div><div class="l">'+t("fav_w")+'</div><div class="s">'+t("rnd").replace("%s",pc(1/n))+'</div></div>'
    +'<div class="card"><div class="l">'+t("m_pre")+'</div><div class="n g">'+pc(a.podio)+'</div><div class="l">'+t("pod")+'</div><div class="s">'+t("rnd").replace("%s",pc(3/n))+'</div></div>'
    +'<div class="card"><div class="l">'+t("m_grid")+'</div><div class="n g">'+pc(b.favorito_gana)+'</div><div class="l">'+t("fav_w")+'</div><div class="s">'+t("pole")+': '+pc(b.pole_gana)+'</div></div>'
    +'<div class="card"><div class="l">'+t("m_grid")+'</div><div class="n g">'+pc(b.podio)+'</div><div class="l">'+t("pod")+'</div></div></div>';
  var li=d.directo||{};
  o+='<h2>'+t("live")+'</h2>'+(li.carreras?'<div class="grid"><div class="card"><div class="n g">'+pc(li.acierto)+'</div><div class="l">'+t("fav_w")+'</div><div class="s">'+t("live_n").replace("%s",li.carreras)+'</div></div><div class="card"><div class="n g">'+pc(li.podio)+'</div><div class="l">'+t("pod")+'</div></div></div>':'<div class="empty">'+t("live_none")+'</div>');
  o+='<div class="box">'+t("src")+': '+esc(d.fuentes||"")+' · '+esc(d.actualizado||"")+'</div>';
  return o;
}
function vRank(d){
  var F=d.fuerzas||[]; if(!F.length) return '<div class="empty">'+t("nodata")+'</div>';
  var mx=Math.max.apply(null,F.map(function(x){return x.total;})), mn=Math.min.apply(null,F.map(function(x){return x.total;}));
  function w(v){ return mx>mn?Math.round(100*(v-mn)/(mx-mn)):50; }
  var o='<h2>'+t("rk")+'</h2><div class="note">'+t("rk_n")+'</div><table><tr><th>'+t("pos")+'</th><th class="l">'+t("driver")+'</th><th>'+t("total")+'</th><th class="hide-m">'+t("only")+'</th></tr>'
    +F.map(function(x,i){ return '<tr><td>'+(i+1)+'</td><td class="l"><b>'+esc(x.n)+'</b><span class="sub">'+esc(x.eq)+'</span></td><td><div class="cb"><div class="bar"><i style="width:'+w(x.total)+'%;background:var(--blue)"></i></div><b>'+Math.round(x.total)+'</b></div></td><td class="hide-m">'+Math.round(x.piloto)+'</td></tr>'; }).join("")+'</table>';
  var E=d.equipos||[];
  if(E.length) o+='<h2>'+t("teams")+'</h2><table><tr><th>'+t("pos")+'</th><th class="l">'+t("team")+'</th><th>'+t("total")+'</th></tr>'+E.map(function(x,i){ return '<tr><td>'+(i+1)+'</td><td class="l">'+esc(x.eq)+'</td><td>'+Math.round(x.f)+'</td></tr>'; }).join("")+'</table>';
  return o;
}
function vHist(d){
  var R=d.recientes||[], o='<h2>'+t("h_rec")+'</h2>';
  o+=R.length?R.map(function(r){ var s=r.resultado||{};
    return '<div class="ex"><span class="d">'+esc(fecha(r.fecha,false))+'</span><span><b>'+esc(r.nombre)+'</b><span class="sub" style="display:block;font-size:12px;color:var(--mut)">'+(r.tipo==="parrilla"?t("grid"):t("m_pre"))+'</span></span>'
      +'<span>'+t("our")+': <b>'+esc(r.fav.n)+'</b> '+pc(r.fav.pw)+'<br>'+t("won")+': <b>'+esc(s.ganador_n)+'</b> ('+t("gave")+' '+pc(s.p_ganador)+')</span>'
      +'<span class="'+(s.acierto?'ok':'ko')+'">'+(s.acierto?t("hit"):t("miss"))+'</span></div>'; }).join(""):'<div class="empty">'+t("h_none")+'</div>';
  var U=d.ultimas||[];
  if(U.length) o+='<h2>'+t("h_last")+'</h2><table><tr><th class="l">'+t("race")+'</th><th class="l">'+t("won")+'</th></tr>'+U.map(function(u){ return '<tr><td class="l">'+esc(u.nombre)+'<span class="sub">'+esc(fecha(u.fecha,false))+'</span></td><td class="l"><b>'+esc(u.ganador)+'</b><span class="sub">'+esc(u.equipo)+'</span></td></tr>'; }).join("")+'</table>';
  return o;
}
function render(){
  document.documentElement.lang=lang;
  if(window.navRender) navRender(lang,"motor");
  document.getElementById("h1").textContent=t("h1");
  document.getElementById("lead").textContent=t("lead");
  document.getElementById("foot").textContent=t("foot");
  ["pred","stats","rank","hist"].forEach(function(k){ var b=document.getElementById("t-"+k); b.textContent=t("t_"+k); b.className="tb"+(tab===k?" on":""); });
  document.getElementById("ligas").innerHTML=SERIES.map(function(s){ return '<div class="lg'+(serie===s.id?' on':'')+'" onclick="setS(\''+s.id+'\')"><span class="ic">'+s.ic+'</span>'+s[lang]+'</div>'; }).join("");
  var d=D[serie];
  if(d===undefined){ document.getElementById("m").innerHTML='<div class="empty">…</div>'; return; }
  if(d===null){ document.getElementById("m").innerHTML='<div class="empty">'+t("nodata")+'</div>'; return; }
  document.getElementById("m").innerHTML=tab==="pred"?vPred(d):tab==="stats"?vStats(d):tab==="rank"?vRank(d):vHist(d);
}
render();
SERIES.forEach(function(s){
  fetch("data/carreras_"+s.id+".json?v="+Date.now()).then(function(r){ if(!r.ok) throw 0; return r.json(); })
   .then(function(j){ D[s.id]=j; render(); }).catch(function(){ D[s.id]=null; render(); });
});
</script>
</body>
</html>
