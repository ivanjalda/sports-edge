<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sports Edge · Predicciones deportivas con datos reales</title>
<meta name="description" content="Probabilidades de fútbol, tenis, baloncesto y hockey calculadas con resultados reales, comparadas con las cuotas de las casas de apuestas y con un historial público de aciertos.">
<style>
:root{--bg:#0b0f17;--card:#121826;--card2:#0f1522;--line:#1f2937;--txt:#e5e7eb;--mut:#8b95a7;--acc:#22c55e;--blue:#38bdf8;--red:#ef4444;--amb:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
main{max-width:1100px;margin:0 auto;padding:22px 20px}
a{color:var(--blue)}
.hero{padding:18px 0 6px}
.hero h1{font-size:30px;line-height:1.2;margin:0 0 8px;letter-spacing:-.3px}
.hero h1 span{color:var(--acc)}
.hero p{color:var(--mut);font-size:15px;max-width:760px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 6px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:24px}
.kpi span{color:var(--mut);font-size:12px}
.clocks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0 4px}
.ck{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
.ck b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.ck span{display:block;font-size:11px;color:var(--mut)}
.ck small{display:block;font-size:10px;color:var(--blue);margin-top:1px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--blue);margin:30px 0 4px}
.note{color:var(--mut);font-size:13px;margin-bottom:12px}
.sports{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.spc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--txt);transition:border-color .15s}
.spc:hover{border-color:var(--acc)}
.spc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.spc .nm{font-size:19px;font-weight:800}
.spc .cm{font-size:12px;color:var(--mut)}
.spc .nx{font-size:12px;font-weight:700;color:var(--acc);background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.35);padding:3px 8px;border-radius:20px;white-space:nowrap}
.spc .nx.z{color:var(--mut);background:transparent;border-color:var(--line)}
.met{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.met div{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.met b{display:block;font-size:17px}
.met b.g{color:var(--acc)}
.met span{font-size:11px;color:var(--mut);line-height:1.3;display:block}
.spc .go{font-size:13px;font-weight:700;color:var(--blue)}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.it{display:grid;grid-template-columns:34px 92px 1fr 150px 74px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;color:var(--txt);text-decoration:none}
.it:last-child{border-bottom:0}
.it:hover{background:var(--card2)}
.it .ic{font-size:20px;text-align:center}
.it .tm{font-size:12px;color:var(--mut);line-height:1.3}
.it .mt{line-height:1.3}
.it .mt small{display:block;color:var(--mut);font-size:11px}
.it .pk{font-size:13px;line-height:1.3}
.it .pk small{display:block;color:var(--mut);font-size:11px}
.it .pb{text-align:center;background:var(--card2);border:1px solid var(--acc);border-radius:8px;padding:4px 2px}
.it .pb b{display:block;color:var(--acc);font-size:15px}
.it .pb small{font-size:11px;color:var(--mut)}
.vb{display:inline-block;background:var(--acc);color:var(--bg);font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
.empty{color:var(--mut);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:12px;font-size:14px}
.warn{font-size:12px;color:var(--amb);margin-top:8px}
.soon{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sn{background:var(--card2);border:1px dashed var(--line);border-radius:12px;padding:12px;text-align:center;color:var(--mut);font-size:13px}
.sn b{display:block;font-size:22px;margin-bottom:2px}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hw{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px;color:var(--mut)}
.hw b{display:block;color:var(--txt);font-size:15px;margin-bottom:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.chip{flex:0 0 auto;background:var(--card);color:var(--mut);border:1px solid var(--line);padding:6px 12px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.nw{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--txt)}
.nw:last-child{border-bottom:0}
.nw:hover{background:var(--card2)}
.nw .s{font-size:11px;color:var(--mut);line-height:1.35}
.nw .s b{display:block;color:var(--blue);font-size:12px}
.nw .h{font-size:14px;line-height:1.4}
.more{display:block;margin:10px auto 0;background:transparent;border:1px solid var(--line);color:var(--blue);padding:7px 16px;border-radius:20px;cursor:pointer;font-weight:600;font-size:13px}
@media(max-width:720px){ .nw{grid-template-columns:1fr;gap:2px} }
footer{color:var(--mut);font-size:12px;padding:24px;text-align:center;border-top:1px solid var(--line);margin-top:34px}
@media(max-width:900px){
 .kpis{grid-template-columns:repeat(2,1fr)}
 .clocks{grid-template-columns:repeat(3,1fr)}
 .sports{grid-template-columns:1fr}
 .soon,.how{grid-template-columns:repeat(2,1fr)}
 .it{grid-template-columns:28px 1fr 68px}
 .it .tm,.it .pk{display:none}
 .it .mt .mb{display:block}
}
@media(min-width:901px){ .it .mt .mb{display:none} }
@media(max-width:720px){ main{padding:16px} .hero h1{font-size:24px} .how{grid-template-columns:1fr} }
</style>
</head>
<body>
<header id="top"></header>
<main>
  <section class="hero">
    <h1 id="h1"></h1>
    <p id="sub"></p>
  </section>
  <div class="kpis" id="kpis"></div>
  <div class="clocks" id="clocks"></div>

  <h2 id="h-top"></h2><div class="note" id="n-top"></div>
  <div id="top-list"></div>

  <h2 id="h-val"></h2><div class="note" id="n-val"></div>
  <div id="val-list"></div>


  <h2 id="h-sp"></h2><div class="note" id="n-sp"></div>
  <div class="sports" id="sports"></div>

  <h2 id="h-soon"></h2><div class="note" id="n-soon"></div>
  <div class="soon" id="soon"></div>

  <h2 id="h-how"></h2>
  <div class="how" id="how"></div>
</main>
<footer id="foot"></footer>
<script src="nav.js"></script>

};
var DEP={
 futbol:{es:"Fútbol",en:"Football",ic:"⚽",url:"futbol.html",cm_es:"Premier · LaLiga · Serie A · Bundesliga · Ligue 1 · Portugal · Países Bajos · Championship · Brasil · Argentina · MLS",cm_en:"Premier · LaLiga · Serie A · Bundesliga · Ligue 1 · Portugal · Netherlands · Championship · Brazil · Argentina · MLS",n:11},
 tenis:{es:"Tenis",en:"Tennis",ic:"🎾",url:"tenis.html",cm_es:"ATP · WTA (Grand Slam, 1000 y 500)",cm_en:"ATP · WTA (Grand Slams, 1000s and 500s)",n:2},
 baloncesto:{es:"Baloncesto",en:"Basketball",ic:"🏀",url:"equipos.html?dep=baloncesto",cm_es:"NBA · Euroliga · Eurocup · NCAA · WNBA",cm_en:"NBA · EuroLeague · EuroCup · NCAA · WNBA",n:5,ligas:["nba","euroliga","eurocup","ncaab","wnba"]},
 hockey:{es:"Hockey",en:"Hockey",ic:"🏒",url:"equipos.html?dep=hockey",cm_es:"NHL · NCAA",cm_en:"NHL · NCAA",n:2,ligas:["nhl","ncaah"]}
};
var NOMBRE_LIGA={nba:"NBA",euroliga:"Euroliga",eurocup:"Eurocup",ncaab:"NCAA",wnba:"WNBA",nhl:"NHL",ncaah:"NCAA"};
var SOON=[{ic:"🏐",es:"Voleibol",en:"Volleyball"},{ic:"🥊",es:"Boxeo",en:"Boxing"},{ic:"🥋",es:"MMA",en:"MMA"},{ic:"🏇",es:"Caballos",en:"Horse racing"}];
var CLOCKS=[
 {tz:"Europe/Madrid",es:"Madrid",en:"Madrid",x_es:"LaLiga · Euroliga",x_en:"LaLiga · EuroLeague"},
 {tz:"Europe/London",es:"Londres",en:"London",x_es:"Premier · Wimbledon",x_en:"Premier · Wimbledon"},
 {tz:"America/New_York",es:"Nueva York",en:"New York",x_es:"NBA · NHL · US Open",x_en:"NBA · NHL · US Open"},
 {tz:"America/Los_Angeles",es:"Los Ángeles",en:"Los Angeles",x_es:"NBA · NHL",x_en:"NBA · NHL"},
 {tz:"Australia/Melbourne",es:"Melbourne",en:"Melbourne",x_es:"Open de Australia",x_en:"Australian Open"},
 {tz:"Asia/Tokyo",es:"Tokio",en:"Tokyo",x_es:"Hora de Asia",x_en:"Asia time"}
];
var lang="es";
try{ lang=localStorage.getItem("lang")||(navigator.language.indexOf("es")==0?"es":"en"); }catch(e){}
var D={};
function setLang(l){ lang=l; try{localStorage.setItem("lang",l)}catch(e){} render(); }
function t(k){ return T[lang][k]; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function num(x){ return typeof x==="number" && isFinite(x); }
function dec(v,n){ var s=v.toFixed(n); return lang==="es"?s.replace(".",","):s; }
function pc(x,d){ return num(x)?dec(x*100,d||0)+"%":t("nodata"); }
function loc(){ return lang==="es"?"es-ES":"en-GB"; }
function fwhen(iso){
  try{ var d=new Date(iso), n=new Date(), m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1);
    var h=d.toLocaleTimeString(loc(),{hour:"2-digit",minute:"2-digit"});
    if(d.toDateString()===n.toDateString()) return t("today")+" "+h;
    if(d.toDateString()===m.toDateString()) return t("tomorrow")+" "+h;
    return d.toLocaleDateString(loc(),{weekday:"short",day:"numeric"})+" "+h; }catch(e){ return ""; }
}

/* ---- reunir todos los partidos proximos en un formato comun ---- */
function proximos(){
  var out=[], ahora=Date.now(), lim=ahora+48*3600*1000;
  function dentro(f){ var x=Date.parse(f); return x>ahora-2*3600*1000 && x<lim; }
  var fp=(D.f_pred&&D.f_pred.predicciones)||[], fc=(D.f_cuotas&&D.f_cuotas.partidos)||{};
  for(var i=0;i<fp.length;i++){ var p=fp[i]; if(!dentro(p.fecha)) continue;
    var pr={"1":p.p_local,"X":p.p_empate,"2":p.p_visitante}, k="1"; if(pr.X>pr[k]) k="X"; if(pr["2"]>pr[k]) k="2";
    var c=fc[String(p.id)], mj=c&&c.mejor&&c.mejor[k];
    out.push({dep:"futbol",comp:p.liga,fecha:p.fecha,a:p.local,b:p.visitante,
      pick:k==="1"?p.local:(k==="2"?p.visitante:t("draw")),prob:pr[k],
      cuota:mj?mj.c:null,casa:mj?mj.casa:null,valor:!!(c&&c.valor&&c.valor.length),
      vk:c&&c.valor&&c.valor.length?c.valor:null,c:c,pr:pr,nm:{"1":p.local,"X":t("draw"),"2":p.visitante},url:"futbol.html"}); }
  var tp=(D.t&&D.t.predicciones)||[];
  for(var j=0;j<tp.length;j++){ var q=tp[j]; if(!dentro(q.fecha)) continue;
    var k2=q.p1>=q.p2?"1":"2", c2=q.cuota, mj2=c2&&c2.mejor&&c2.mejor[k2];
    out.push({dep:"tenis",comp:q.torneo,fecha:q.fecha,a:q.j1,b:q.j2,pick:k2==="1"?q.j1:q.j2,prob:Math.max(q.p1,q.p2),
      cuota:mj2?mj2.c:null,casa:mj2?mj2.casa:null,valor:!!(c2&&c2.valor&&c2.valor.length),vk:c2&&c2.valor,c:c2,
      pr:{"1":q.p1,"2":q.p2},nm:{"1":q.j1,"2":q.j2},url:"tenis.html"}); }
  ["baloncesto","hockey"].forEach(function(dp){
    DEP[dp].ligas.forEach(function(lg){
      var d=D["e_"+lg]; if(!d||!d.predicciones) return;
      for(var m=0;m<d.predicciones.length;m++){ var r=d.predicciones[m]; if(!dentro(r.fecha)) continue;
        var k3=r.pl>=r.pv?"L":"V", c3=r.cuota, mj3=c3&&c3.mejor&&c3.mejor[k3];
        out.push({dep:dp,comp:NOMBRE_LIGA[lg],fecha:r.fecha,a:r.local,b:r.visitante,pick:k3==="L"?r.local:r.visitante,
          prob:Math.max(r.pl,r.pv),cuota:mj3?mj3.c:null,casa:mj3?mj3.casa:null,valor:!!(c3&&c3.valor&&c3.valor.length),
          vk:c3&&c3.valor,c:c3,pr:{"L":r.pl,"V":r.pv},nm:{"L":r.local,"V":r.visitante},url:"equipos.html?dep="+dp+"&liga="+lg}); }
    });
  });
  return out;
}
function fila(x,valorMode){
  var pick=x.pick, prob=x.prob, cu=x.cuota, casa=x.casa;
  if(valorMode&&x.vk&&x.vk.length&&x.c&&x.c.mejor){ var k=x.vk[0]; pick=x.nm[k]; prob=x.pr[k]; cu=x.c.mejor[k]&&x.c.mejor[k].c; casa=x.c.mejor[k]&&x.c.mejor[k].casa; }
  var lab=valorMode?t("vpick"):t("pick");
  var cuo=cu?(t("best")+" "+dec(cu,2)+(casa?" "+t("at")+" "+esc(casa):"")):"";
  return '<a class="it" href="'+esc(x.url)+'"><span class="ic">'+DEP[x.dep].ic+'</span>'
    +'<span class="tm">'+esc(fwhen(x.fecha))+'<br>'+esc(x.comp||"")+'</span>'
    +'<span class="mt">'+esc(x.a)+' – '+esc(x.b)+(x.valor?'<span class="vb">'+t("vb")+'</span>':'')
    +'<small class="mb">'+esc(fwhen(x.fecha))+' · '+esc(x.comp||"")+' · '+lab+': '+esc(pick)+(cuo?' · '+cuo:'')+'</small></span>'
    +'<span class="pk">'+lab+': <b>'+esc(pick)+'</b>'+(cuo?'<small>'+cuo+'</small>':'')+'</span>'
    +'<span class="pb"><b>'+pc(prob)+'</b><small>'+(cu?dec(cu,2):'&nbsp;')+'</small></span></a>';
}

/* ---- resumen por deporte ---- */
function sumar(lst){ var n=0,h=0,bl=0,ln=0,lh=0,up=0;
  lst.forEach(function(o){ if(!o) return; n+=o.n||0; h+=o.h||0; bl+=o.bl||0; ln+=o.ln||0; lh+=o.lh||0; up+=o.up||0; });
  return {n:n,acc:n?h/n:null,rule:n?bl/n:null,ln:ln,live:ln?lh/ln:null,up:up}; }
function resumenDep(dp){
  if(dp==="futbol"){ var b=D.f_bt&&D.f_bt.total, s=D.f_stats||{};
    return {n:b?b.n:0,acc:b?b.acierto:null,rule:b?b.siempre_local:null,ln:s.resueltas||0,live:s.acierto,
            up:((D.f_pred&&D.f_pred.predicciones)||[]).length}; }
  if(dp==="tenis"){ var tb=D.t_bt&&D.t_bt.total, dr=(D.t&&D.t.directo)||{};
    return {n:tb?tb.n:0,acc:tb?tb.acierto:null,rule:tb?tb.mejor_ranking:null,ln:dr.resueltas||0,live:dr.acierto,
            up:((D.t&&D.t.predicciones)||[]).length,old:D.t&&D.t.dias_desde_datos>30}; }
  return sumar(DEP[dp].ligas.map(function(lg){ var b2=D["b_"+lg], e=D["e_"+lg]; if(!b2||!b2.total) return null;
    var d2=(e&&e.directo)||{};
    return {n:b2.total.n,h:b2.total.aciertos,bl:(b2.base_local&&b2.base_local.acierto||0)*b2.total.n,
            ln:d2.resueltas||0,lh:d2.aciertos||0,up:(e&&e.predicciones||[]).length}; }));
}

function tickClocks(){
  var o="";
  for(var i=0;i<CLOCKS.length;i++){ var c=CLOCKS[i], h="";
    try{ h=new Date().toLocaleTimeString(loc(),{hour:"2-digit",minute:"2-digit",timeZone:c.tz}); }catch(e){ h="--:--"; }
    o+='<div class="ck"><span>'+esc(c[lang])+'</span><b>'+h+'</b><small>'+esc(c["x_"+lang])+'</small></div>'; }
  document.getElementById("clocks").innerHTML=o;
}

function render(){
  document.documentElement.lang=lang;
  if(window.navRender) navRender(lang,"home");
  document.getElementById("h1").innerHTML=t("h1");
  ["sub","h-top","n-top","h-val","n-val","h-sp","n-sp","h-soon","n-soon","h-how"].forEach(function(id){
    document.getElementById(id).textContent=t(id.replace("-","_")); });
  document.getElementById("foot").textContent=t("foot");
  var deps=["futbol","tenis","baloncesto","hockey"], R={}, totN=0, totUp=0, comp=0;
  deps.forEach(function(d){ R[d]=resumenDep(d); totN+=R[d].n||0; totUp+=R[d].up||0; comp+=DEP[d].n; });
  var upd=(D.f_stats&&D.f_stats.actualizado)||(D.t&&D.t.actualizado)||"";
  document.getElementById("kpis").innerHTML=
     '<div class="kpi"><b>'+comp+'</b><span>'+t("k_comp")+'</span></div>'
    +'<div class="kpi"><b>'+totN.toLocaleString(loc())+'</b><span>'+t("k_bt")+'</span></div>'
    +'<div class="kpi"><b>'+totUp+'</b><span>'+t("k_next")+'</span></div>'
    +'<div class="kpi"><b style="font-size:16px;padding:5px 0">'+esc(upd||t("nodata"))+'</b><span>'+t("k_upd")+'</span></div>';
  tickClocks();
  var px=proximos();
  var cnt={}, top=[];
  px.slice().sort(function(a,b){ return b.prob-a.prob; }).forEach(function(x){ cnt[x.dep]=(cnt[x.dep]||0)+1; if(cnt[x.dep]<=3) top.push(x); });
  top=top.slice(0,12);
  document.getElementById("top-list").innerHTML= top.length ? '<div class="list">'+top.map(function(x){return fila(x,false);}).join("")+'</div>' : '<div class="empty">'+t("notop")+'</div>';
  var val=px.filter(function(x){ return x.valor; }).sort(function(a,b){ return a.fecha<b.fecha?-1:1; }).slice(0,10);
  document.getElementById("val-list").innerHTML= val.length ? '<div class="list">'+val.map(function(x){return fila(x,true);}).join("")+'</div>' : '<div class="empty">'+t("noval")+'</div>';
  var sp="";
  deps.forEach(function(d){ var r=R[d], g=DEP[d];
    sp+='<a class="spc" href="'+g.url+'"><div class="top"><div><div class="nm">'+g.ic+' '+esc(g[lang])+'</div><div class="cm">'+esc(g["cm_"+lang])+'</div></div>'
      +'<span class="nx'+(r.up?'':' z')+'">'+(r.up?r.up+' '+t("next"):t("none"))+'</span></div>'
      +'<div class="met"><div><b class="g">'+pc(r.acc,1)+'</b><span>'+t("bt")+' · '+(r.n||0).toLocaleString(loc())+' '+t("games")+'</span></div>'
      +'<div><b>'+pc(r.rule,1)+'</b><span>'+t("rule")+'</span></div>'
      +'<div><b>'+(r.ln?pc(r.live,1):t("nodata"))+'</b><span>'+t("live")+(r.ln?' · '+r.ln+' '+t("games"):'')+'</span></div></div>'
      +(r.old?'<div class="warn">'+t("old")+'</div>':'')
      +'<span class="go">'+t("go")+' '+esc(g[lang])+' →</span></a>'; });
  document.getElementById("sports").innerHTML=sp;
  document.getElementById("soon").innerHTML=SOON.map(function(s){ return '<div class="sn"><b>'+s.ic+'</b>'+esc(s[lang])+'</div>'; }).join("");
  document.getElementById("how").innerHTML=[1,2,3].map(function(i){ return '<div class="hw"><b>'+t("hw"+i)+'</b>'+t("hw"+i+"t")+'</div>'; }).join("");
}
var newsDep="todas", newsMax=12;
function hace(iso){ var m=Math.round((Date.now()-Date.parse(iso))/60000); if(!(m>=0)) return "";
  return m<60 ? t("ago_m").replace("%d",m) : t("ago_h").replace("%d",Math.round(m/60)); }
function setNews(d){ newsDep=d; newsMax=12; renderNews(); }
function moreNews(){ newsMax+=18; renderNews(); }
function renderNews(){
  var all=(D.news&&D.news[lang])||[], cats=["todas","futbol","tenis","baloncesto","hockey","general"], ch="";
  cats.forEach(function(c){ var n=c==="todas"?all.length:all.filter(function(x){return x.dep===c;}).length;
    if(c!=="todas"&&!n) return;
    ch+='<button class="chip'+(newsDep===c?' on':'')+'" onclick="setNews(\''+c+'\')">'+(c==="todas"?t("n_all"):t("n_"+c))+' ('+n+')</button>'; });
  document.getElementById("news-chips").innerHTML=all.length?ch:"";
  var l=newsDep==="todas"?all:all.filter(function(x){return x.dep===newsDep;});
  if(!l.length){ document.getElementById("news-list").innerHTML='<div class="empty">'+t("nonews")+'</div>'; return; }
  var o='<div class="list">';
  l.slice(0,newsMax).forEach(function(x){ if(!/^https?:\/\//.test(x.url)) return;
    o+='<a class="nw" href="'+esc(x.url)+'" target="_blank" rel="noopener nofollow"><span class="s"><b>'+esc(x.fuente)+'</b>'+esc(hace(x.fecha))+'</span><span class="h">'+esc(x.t)+'</span></a>'; });
  o+='</div>'+(l.length>newsMax?'<button class="more" onclick="moreNews()">'+t("more")+'</button>':'');
  document.getElementById("news-list").innerHTML=o;
}
function load(f,k){ return fetch("data/"+f+"?v="+Date.now()).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(j){ D[k]=j; }).catch(function(){ D[k]=null; }); }
var cargas=[load("predicciones.json","f_pred"),load("estadisticas.json","f_stats"),load("backtest.json","f_bt"),load("cuotas.json","f_cuotas"),
            load("tenis.json","t"),load("tenis_backtest.json","t_bt"),load("noticias.json","news")];
["nba","euroliga","eurocup","ncaab","wnba","nhl","ncaah"].forEach(function(lg){
  cargas.push(load("equipos_"+lg+".json","e_"+lg)); cargas.push(load("equipos_"+lg+"_backtest.json","b_"+lg)); });
render();
Promise.all(cargas).then(render);
setInterval(tickClocks,30000);
</script>
</body>
</html>
