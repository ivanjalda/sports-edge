en:{h1:"⚖️ Legal information",lead:"How we handle your data, what we store in your browser, who is behind SportEVLab and how to gamble responsibly.",
 tabs:["🔒 Privacy","🍪 Cookies","📄 Legal notice","🛟 Responsible gambling"],fecha:"Last updated: 18/11/2026",foot:"🔞 18+ only. Please gamble responsibly.",
 privacidad:
 '<h2>Who is responsible</h2><div class="box"><b>'+EMPRESA+'</b><br>'+DIRECCION+'<br>Email: '+MAIL+'<br>Website: '+WEBN+'</div>'
+'<p>'+EMPRESA+' is a New Mexico (USA) limited liability company and is the controller of the data processed on SportEVLab.</p>'
+'<h2>What data we keep</h2><p>Only if you create an account. Without an account you can use the website and we keep no data about you.</p><ul>'
+'<li><b>Account data:</b> name, email address and, if you sign in with Google, your Google profile picture. If you use email and password, the password is stored encrypted by Google Firebase: we never see it.</li>'
+'<li><b>Your preferences:</b> language, favourite sports, teams and athletes you follow, whether you want the daily email, which Telegram channel you choose and whether you agree to receive news from our other websites.</li>'
+'<li><b>Technical record:</b> account creation date, date you accepted this policy, last update and day of the last daily email sent (so you never get two on the same day).</li></ul>'
+'<p>We do not ask for bank details, health data, your address or your phone number. We never sell or rent your data.</p>'
+'<h2>Why we use it and on what basis</h2><ul>'
+'<li><b>To provide your account and your space</b> (favourites, preferences): because you request it when you sign up (performance of the service).</li>'
+'<li><b>To send the daily email:</b> only if you turn it on in “My alerts” (consent). You can turn it off any time on the same screen or with the link at the end of every email.</li>'
+'<li><b>News from our other websites</b> (Equity Intrinsic, Nexus Terminal Alerts, DAZ Premium Fit, Valmont &amp; Co. and DAZMOND, all owned by the same company): only if you tick that box (consent, which you can withdraw at any time).</li></ul>'
+'<h2>Who else is involved</h2><p>We use these providers to run the website. They only receive what is strictly needed:</p><ul>'
+'<li><b>Google Firebase</b> (Google LLC, USA): sign-in and storage of your account and preferences.</li>'
+'<li><b>Brevo</b> (Sendinblue SAS, France): sending the daily email. It receives your email address, your name and the content of the email.</li>'
+'<li><b>GitHub Pages</b> (GitHub Inc., USA): website hosting. Like any server, it logs technical visit data (such as the IP address) for security.</li>'
+'<li><b>Cloudflare Web Analytics</b> (Cloudflare Inc., USA): counts visits anonymously (pages viewed, country, browser type). It uses no cookies, does not store your IP and builds no profiles.</li>'
+'<li><b>Telegram:</b> if you join our channels, you do so on Telegram with your Telegram account. We do not receive your Telegram data.</li></ul>'
+'<p>Some of these providers are in the United States. Transfers are made with the safeguards required by law (for example, the EU-US Data Privacy Framework or standard contractual clauses).</p>'
+'<h2>How long we keep it</h2><p>For as long as you have an account. If you delete it, your account and preferences are removed immediately. Providers may keep technical logs for a limited time under their own policies.</p>'
+'<h2>Your rights</h2><p>You can view and change your data in “My account”, and <b>delete your account and all your data</b> in “My account → Settings”. You can also ask us for access, rectification, erasure, objection, restriction or portability by writing to '+MAIL+'. We will reply within 30 days.</p>'
+'<p>If you live in the European Union, you can complain to your country’s data protection authority (in Spain, the AEPD, <a href="https://www.aepd.es" target="_blank" rel="noopener">aepd.es</a>). If you live in California, you also have CCPA rights: we do not sell or share your data for advertising.</p>'
+'<h2>Minors</h2><p>SportEVLab is for people aged 18 or over only. By signing up you confirm you are. If we learn an account belongs to a minor, we delete it.</p>'
+'<h2>Changes</h2><p>If we change this policy, we will update the date below and, if the change is important, let you know by email or on the website.</p>',
 cookies:
 '<h2>Summary</h2><div class="box"><b>SportEVLab does not use advertising or tracking cookies.</b> There are no third-party ads following you and no profiles built to sell you anything.</div>'
+'<h2>What we do store in your browser</h2><p>A few technical items in your browser’s local storage (they are not cookies sent to other websites), needed so the website works the way you left it:</p><ul>'
+'<li><b>lang:</b> the language you choose (Spanish or English).</li>'
+'<li><b>tema:</b> whether you prefer the light or dark website.</li>'
+'<li><b>se_user:</b> your name, to show it at the top in “My account” when you are logged in.</li>'
+'<li><b>directo_solo:</b> whether you want “Live” to show only games with our prediction.</li>'
+'<li><b>Firebase session:</b> if you log in, Google Firebase keeps your session in your browser so you don’t have to log in every time.</li></ul>'
+'<p>All of them are technical and necessary, so no consent is required to use them. They are removed when you log out or clear your browser data.</p>'
+'<h2>Visit statistics</h2><p>To know how many people visit the website we use <b>Cloudflare Web Analytics</b>, which works <b>without cookies</b> and without storing data that identifies you: it only counts visits anonymously.</p>'
+'<h2>Third-party services</h2><ul>'
+'<li><b>Sign in with Google:</b> only if you press that button, Google uses its own cookies in its sign-in window, under its own privacy policy.</li>'
+'<li><b>External images and links:</b> some news items and our other websites show images hosted on their own sites. When loaded, those sites receive the normal technical data of any visit (such as the IP address).</li></ul>'
+'<h2>How to delete them</h2><p>You can delete this site’s data from your browser settings at any time. The website will keep working; you will only lose your language and theme preferences and will need to log in again.</p>',
