name: Resultados Telegram

# Vigilante de Telegram: un turno dura unas 5 horas y media y, al terminar, lanza el siguiente.
# Cada 10 minutos mira los partidos terminados; a las 9:30 (hora de Madrid) manda los pronosticos
# del dia y a las 23:40 el balance. La tarea programada de cada hora es solo de reserva por si
# la cadena se corta: si ya hay un turno en marcha, espera y no se duplica nada.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: resultados-telegram
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Vigilar resultados y enviar a Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO: bucle
          DURACION: "330"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -u scripts/telegram_directo.py

      - name: Lanzar el siguiente turno
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run resultados.yml --ref "${{ github.ref_name }}" || true
