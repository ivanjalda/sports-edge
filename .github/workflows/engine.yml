name: Motor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"
    - cron: "30 22 * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ejecutar motor
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python3 scripts/engine.py

      - name: Backtest
        continue-on-error: true
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python3 scripts/backtest.py

      - name: Laboratorio
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python3 scripts/laboratorio.py

      - name: Cuotas y valor
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_FETCH: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * *' }}
        run: python3 scripts/odds.py

      - name: Tenis
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_FETCH: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * *' }}
        run: GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} python3 scripts/tenis.py

      - name: Baloncesto y hockey
        continue-on-error: true
        timeout-minutes: 45
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_FETCH: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * *' }}
        run: python3 -u scripts/equipos.py

      - name: Noticias
        continue-on-error: true
        timeout-minutes: 5
        run: python3 -u scripts/noticias.py

      - name: Guardar datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar datos"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1

      - name: Enviar a Telegram
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * *'
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram.py
