<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sports Edge · En directo</title>
<meta name="description" content="Resultados en directo de fútbol, baloncesto, hockey, fútbol americano, béisbol y voleibol, con nuestra predicción antes de cada partido.">
<style>
:root{--bg:#0b0f17;--card:#121826;--card2:#0f1522;--line:#1f2937;--txt:#e5e7eb;--mut:#8b95a7;--acc:#22c55e;--blue:#38bdf8;--red:#ef4444;--amb:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:22px 20px}
h1{font-size:26px;margin:6px 0 4px}
.lead{color:var(--mut);font-size:14px;margin-bottom:10px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 6px}
.upd{font-size:12px;color:var(--mut)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;animation:p 1.4s infinite}
@keyframes p{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.chip{background:var(--card);color:var(--mut);border:1px solid var(--line);padding:6px 12px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.chip .lv{color:var(--red);font-weight:800}
.chip.on .lv{color:var(--bg)}
h2{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--blue);margin:24px 0 8px;display:flex;align-items:center}
.grp{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.gh{padding:9px 14px;font-size:13px;font-weight:700;border-bottom:1px solid var(--line);background:var(--card2);display:flex;justify-content:space-between}
.gh span{color:var(--mut);font-weight:600}
.r{display:grid;grid-template-columns:78px 1fr 46px 190px;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.r:last-child{border-bottom:0}
.st{font-size:12px;color:var(--mut);line-height:1.25}
.st.in{color:var(--red);font-weight:700}
.tm{font-size:14px;line-height:1.45}
.tm .w{font-weight:700}
.sc{text-align:center;font-weight:800;font-size:15px;line-height:1.45}
.pr{font-size:12px;color:var(--mut);line-height:1.35}
.pr b{color:var(--txt)}
.ok{color:var(--acc);font-weight:700}
.ko{color:var(--red);font-weight:700}
.go{color:var(--amb);font-weight:700}
.empty{color:var(--mut);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:12px;font-size:14px}
.warn{font-size:12px;color:var(--mut);margin-top:16px}
@media(max-width:720px){ .r{grid-template-columns:62px 1fr 40px} .pr{grid-column:2 / 4} main{padding:16px} }
footer{color:var(--mut);font-size:12px;padding:24px;text-align:center;border-top:1px solid var(--line);margin-top:30px}
</style>
</head>
<body>
<header id="top"></header>
<main>
  <h1 id="h1"></h1>
  <div class="lead" id="lead"></div>
  <div class="bar"><div class="upd" id="upd"></div></div>
  <div class="chips" id="chips"></div>
  <div id="m"></div>
</main>
<footer id="foot"></footer>
<script src="nav.js"></script>
<script>
/* Marcadores en directo leidos directamente del marcador publico de ESPN desde el navegador.
   La prediccion es la que publicamos ANTES del partido (archivos de data/), nunca se cambia. */
var ESPN="https://site.api.espn.com/apis/site/v2/sports/";
var FUENTES=[
 {dep:"futbol",ic:"⚽",ruta:"soccer/esp.1",liga:"LaLiga",pred:"futbol"},
 {dep:"futbol",ic:"⚽",ruta:"soccer/eng.1",liga:"Premier League",pred:"futbol"},
 {dep:"futbol",ic:"⚽",ruta:"soccer/ita.1",liga:"Serie A",pred:"futbol"},
 {dep:"futbol",ic:"⚽",ruta:"soccer/ger.1",liga:"Bundesliga",pred:"futbol"},
 {dep:"futbol",ic:"⚽",ruta:"soccer/fra.1",liga:"Ligue 1",pred:"futbol"},
 {dep:"futbol",ic:"⚽",ruta:"soccer/por.1",liga:"Primeira Liga",pred:"futbol"},
 {dep:"futbol",ic:"⚽",ruta:"soccer/ned.1",liga:"Eredivisie",pred:"futbol"},
 {dep:"futbol",ic:"⚽",ruta:"soccer/eng.2",liga:"Championship",pred:"futbol"},
 {dep:"futbol",ic:"⚽",ruta:"soccer/bra.1",liga:"Brasileirão",pred:"futbol"},
 {dep:"futbol",ic:"⚽",ruta:"soccer/arg.1",liga:"Liga Profesional",pred:"futbol"},
 {dep:"futbol",ic:"⚽",ruta:"soccer/usa.1",liga:"MLS",pred:"futbol"},
 {dep:"futbol",ic:"⚽",ruta:"soccer/uefa.champions",liga:"Champions League",pred:null},
 {dep:"baloncesto",ic:"🏀",ruta:"basketball/nba",liga:"NBA",pred:"nba"},
 {dep:"baloncesto",ic:"🏀",ruta:"basketball/wnba",liga:"WNBA",pred:"wnba"},
 {dep:"baloncesto",ic:"🏀",ruta:"basketball/mens-college-basketball",extra:"&groups=50&limit=300",liga:"NCAA",pred:"ncaab"},
 {dep:"hockey",ic:"🏒",ruta:"hockey/nhl",liga:"NHL",pred:"nhl"},
 {dep:"americano",ic:"🏈",ruta:"football/nfl",liga:"NFL",pred:"nfl"},
 {dep:"americano",ic:"🏈",ruta:"football/college-football",extra:"&groups=80&limit=300",liga:"NCAA",pred:"ncaaf"},
 {dep:"beisbol",ic:"⚾",ruta:"baseball/mlb",liga:"MLB",pred:"mlb"},
 {dep:"voleibol",ic:"🏐",ruta:"volleyball/womens-college-volleyball",extra:"&limit=300",liga:"NCAA femenina",pred:"voley"}
];
var T={
es:{h1:"🔴 En directo",lead:"Marcadores de hoy que se actualizan solos cada minuto, con la predicción que publicamos antes de cada partido. Así puedes ver en tiempo real si acertamos.",
 upd:"Actualizado",ago:"hace %s s",live:"En juego ahora",later:"Más tarde",fin:"Terminados hoy",all:"Todos",
 none:"Ahora mismo no hay partidos de nuestros deportes hoy.",nolive:"Ahora mismo no hay ningún partido en juego.",
 ours:"Nuestro pronóstico",draw:"Empate",hit:"✓ acertado",miss:"✗ fallado",going:"de momento acierta",notgoing:"de momento falla",
 nopred:"sin predicción nuestra",fail:"No se pudieron leer algunos marcadores. Se reintentará en un minuto.",
 warn:"Marcadores: ESPN. Pueden llevar unos segundos de retraso. Solo para mayores de 18 años. Juega con responsabilidad.",
 dep:{futbol:"Fútbol",baloncesto:"Baloncesto",hockey:"Hockey",americano:"Fútbol americano",beisbol:"Béisbol",voleibol:"Voleibol"}},
en:{h1:"🔴 Live",lead:"Today's scores, refreshing by themselves every minute, next to the prediction we published before each game. See in real time whether we are right.",
 upd:"Updated",ago:"%ss ago",live:"In play now",later:"Later today",fin:"Finished today",all:"All",
 none:"There are no games in our sports today right now.",nolive:"No game is in play right now.",
 ours:"Our pick",draw:"Draw",hit:"✓ correct",miss:"✗ wrong",going:"on track so far",notgoing:"off track so far",
 nopred:"no prediction from us",fail:"Some scores could not be read. Retrying in a minute.",
 warn:"Scores: ESPN. They may be a few seconds behind. 18+ only. Please gamble responsibly.",
 dep:{futbol:"Football",baloncesto:"Basketball",hockey:"Hockey",americano:"American football",beisbol:"Baseball",voleibol:"Volleyball"}}
};
var lang="es", filtro="todos", EV=[], PRED={}, ultima=null, fallos=0;
try{ lang=localStorage.getItem("lang")||(navigator.language.indexOf("es")==0?"es":"en"); }catch(e){}
function setLang(l){ lang=l; try{localStorage.setItem("lang",l)}catch(e){} render(); }
function t(k){ return T[lang][k]; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function pc(x){ return Math.round(x*100)+"%"; }
function norm(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(function(w){ return w&&["fc","cf","sc","ac","cd","rc","ud","club","de","the","afc"].indexOf(w)<0; }); }
function parecido(a,b){ var x=norm(a), y=norm(b); if(!x.length||!y.length) return false;
  if(x.join(" ")===y.join(" ")) return true; var c=0; x.forEach(function(w){ if(w.length>2&&y.indexOf(w)>=0) c++; }); return c>=1&&(c>=Math.min(x.length,y.length)||c>=2); }
function hora(iso){ try{ return new Date(iso).toLocaleTimeString(lang==="es"?"es-ES":"en-GB",{hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }

function buscarPred(f,local,visit,id){
  var lista=PRED[f.pred]||[];
  for(var j=0;j<lista.length;j++){ var q=lista[j]; if(String(q.id)===String(id)||String(q.id)==="espn-"+id) return q; }
  for(var i=0;i<lista.length;i++){ var p=lista[i]; if(parecido(p.local,local)&&parecido(p.visitante,visit)) return p; }
  return null;
}
function leer(f,datos){
  var out=[];
  ((datos&&datos.events)||[]).forEach(function(ev){
    var comp=(ev.competitions||[])[0]; if(!comp) return;
    var cs=comp.competitors||[], h=null, a=null;
    cs.forEach(function(c){ if(c.homeAway==="home") h=c; else if(c.homeAway==="away") a=c; });
    if(!h||!a) return;
    var st=(ev.status||comp.status||{}).type||{};
    out.push({f:f,id:ev.id,fecha:ev.date,estado:st.state,detalle:st.shortDetail||st.detail||"",
      local:(h.team||{}).displayName,visit:(a.team||{}).displayName,
      gl:h.score,gv:a.score,wl:!!h.winner,wv:!!a.winner});
  });
  return out;
}
function cargarPred(){
  var ps=[fetch("data/predicciones.json?v="+Date.now()).then(function(r){return r.json();}).then(function(j){ PRED.futbol=(j.predicciones||[]); }).catch(function(){})];
  ["nba","wnba","ncaab","nhl","nfl","ncaaf","mlb","voley"].forEach(function(lg){
    ps.push(fetch("data/equipos_"+lg+"_historial.json?v="+Date.now()).then(function(r){return r.json();}).then(function(j){ PRED[lg]=(j.predicciones||[]); }).catch(function(){}));
  });
  return Promise.all(ps);
}
function cargar(){
  var errores=0;
  return Promise.all(FUENTES.map(function(f){
    return fetch(ESPN+f.ruta+"/scoreboard?"+(f.extra?f.extra.substr(1):"")).then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(d){ return leer(f,d); }).catch(function(){ errores++; return []; });
  })).then(function(listas){
    var hoy=[].concat.apply([],listas);
    if(hoy.length||!EV.length) EV=hoy;
    fallos=errores; ultima=Date.now(); render();
  });
}
function prediccion(e){
  if(!e.f.pred) return '<span class="pr">'+t("nopred")+'</span>';
  var p=buscarPred(e.f,e.local,e.visit,e.id); if(!p) return '<span class="pr">'+t("nopred")+'</span>';
  var k, prob, nom;
  if(e.f.pred==="futbol"){ var o={"1":p.p_local,"X":p.p_empate,"2":p.p_visitante}; k="1"; if(o.X>o[k]) k="X"; if(o["2"]>o[k]) k="2"; prob=o[k]; nom=k==="1"?e.local:(k==="2"?e.visit:t("draw")); }
  else { k=p.pl>=p.pv?"1":"2"; prob=Math.max(p.pl,p.pv); nom=k==="1"?e.local:e.visit; }
  var gl=parseFloat(e.gl), gv=parseFloat(e.gv), va=isNaN(gl)||isNaN(gv)?null:(gl>gv?"1":(gl<gv?"2":"X"));
  var tag="";
  if(e.estado==="post"&&va){ tag=(va===k)?' <span class="ok">'+t("hit")+'</span>':' <span class="ko">'+t("miss")+'</span>'; }
  else if(e.estado==="in"&&va){ tag=(va===k)?' <span class="ok">· '+t("going")+'</span>':' <span class="go">· '+t("notgoing")+'</span>'; }
  return '<span class="pr">'+t("ours")+': <b>'+esc(nom)+' '+pc(prob)+'</b>'+tag+'</span>';
}
function fila(e){
  var est=e.estado==="in"?'<span class="st in">● '+esc(e.detalle)+'</span>':(e.estado==="pre"?'<span class="st">'+esc(hora(e.fecha))+'</span>':'<span class="st">'+esc(e.detalle)+'</span>');
  var mostrar=e.estado!=="pre";
  return '<div class="r">'+est+'<div class="tm"><div class="'+(e.wl?'w':'')+'">'+esc(e.local)+'</div><div class="'+(e.wv?'w':'')+'">'+esc(e.visit)+'</div></div>'
    +'<div class="sc">'+(mostrar?esc(e.gl)+'<br>'+esc(e.gv):'–')+'</div>'+prediccion(e)+'</div>';
}
function bloque(lista){
  var grupos={}, orden=[];
  lista.forEach(function(e){ var k=e.f.ic+" "+e.f.liga; if(!grupos[k]){ grupos[k]=[]; orden.push(k); } grupos[k].push(e); });
  return orden.map(function(k){ return '<div class="grp"><div class="gh">'+esc(k)+'<span>'+grupos[k].length+'</span></div>'+grupos[k].map(fila).join("")+'</div>'; }).join("");
}
function render(){
  document.documentElement.lang=lang;
  if(window.navRender) navRender(lang,"directo");
  document.title="Sports Edge · "+t("h1").replace("🔴 ","");
  document.getElementById("h1").textContent=t("h1");
  document.getElementById("lead").textContent=t("lead");
  document.getElementById("foot").textContent=t("warn");
  var s=ultima?Math.round((Date.now()-ultima)/1000):null;
  document.getElementById("upd").innerHTML='<span class="dot"></span>'+(s==null?"…":t("upd")+" "+t("ago").replace("%s",s))+(fallos?' · '+t("fail"):'');
  var deps={}, vivo={};
  EV.forEach(function(e){ deps[e.f.dep]=(deps[e.f.dep]||0)+1; if(e.estado==="in") vivo[e.f.dep]=(vivo[e.f.dep]||0)+1; });
  var ch='<button class="chip'+(filtro==="todos"?' on':'')+'" onclick="setF(\'todos\')">'+t("all")+' ('+EV.length+')</button>';
  Object.keys(deps).forEach(function(d){ ch+='<button class="chip'+(filtro===d?' on':'')+'" onclick="setF(\''+d+'\')">'+t("dep")[d]+' ('+deps[d]+')'+(vivo[d]?' <span class="lv">● '+vivo[d]+'</span>':'')+'</button>'; });
  document.getElementById("chips").innerHTML=ch;
  var L=EV.filter(function(e){ return filtro==="todos"||e.f.dep===filtro; });
  if(!ultima){ document.getElementById("m").innerHTML='<div class="empty">…</div>'; return; }
  if(!L.length){ document.getElementById("m").innerHTML='<div class="empty">'+t("none")+'</div>'; return; }
  var inn=L.filter(function(e){return e.estado==="in";}), pre=L.filter(function(e){return e.estado==="pre";}), post=L.filter(function(e){return e.estado==="post";});
  pre.sort(function(a,b){ return a.fecha<b.fecha?-1:1; });
  var o='<h2><span class="dot"></span>'+t("live")+' ('+inn.length+')</h2>'+(inn.length?bloque(inn):'<div class="empty">'+t("nolive")+'</div>');
  if(pre.length) o+='<h2>'+t("later")+' ('+pre.length+')</h2>'+bloque(pre);
  if(post.length) o+='<h2>'+t("fin")+' ('+post.length+')</h2>'+bloque(post);
  document.getElementById("m").innerHTML=o;
}
function setF(d){ filtro=d; render(); }
render();
cargarPred().then(cargar);
setInterval(cargar,60000);
setInterval(function(){ if(ultima) render(); },10000);
</script>
</body>
</html>
